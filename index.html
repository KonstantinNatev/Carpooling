<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <title>Leaflet Карта - София</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
 
<!-- Inter font (вариативен) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./templates/legend/legendTemplate.styles.css" />
  <link rel="stylesheet" href="./templates/schedule/scheduleTemplate.styles.css" />
  <link rel="stylesheet" href="./templates/popUp/popUpTemplate.styles.css" />
  <link rel="stylesheet" href="./index.styles.css" />
</head>

<body>
  <!-- 🗺️ Основна карта -->
  <div id="map"></div>

  <!-- 📅 Панел с разписания -->
  <div id="schedule-panel" class="schedule-panel">
    <button onclick="document.getElementById('schedule-panel').style.display='none'" class="schedule-close-btn" aria-label="Затвори">✖</button>
    <h2 class="schedule-title">Разписание</h2>
    <div id="schedule-content" class="schedule-content"></div>
  </div>

  <!-- 🔘 Филтър панел -->
  <div id="filter-panel">
    <strong>Филтрирай по тип маршрут:</strong>
    <div>
      <label><input type="checkbox" class="route-type" value="tram" checked /> 🚋 Трамвай</label>
      <label><input type="checkbox" class="route-type" value="trolleybus" checked /> 🚎 Тролейбус</label>
      <label><input type="checkbox" class="route-type" value="bus" checked /> 🚌 Автобус</label>
    </div>
  </div>

  <!-- ⚙️ Панел с настройки -->
  <div id="debug-panel">
    <h3>⚙️ Настройки</h3>
    <label for="pointSizeInput">Размер на спирките:</label>
    <input type="number" id="pointSizeInput" value="5" min="1" max="20" />

    <label for="lineWeightInput">Дебелина на маршрут:</label>
    <input type="number" id="lineWeightInput" value="2" min="1" max="10" />

    <label for="highlightWeightInput">Дебелина на избран маршрут:</label>
    <input type="number" id="highlightWeightInput" value="6" min="1" max="15" />

    <button id="applySettingsBtn">Приложи</button>
  </div>

  <!-- 📋 Инфо панел с табове -->
  <div id="info-panel" class="info-panel spark-sheet" data-level="peek">
    <div class="spark-sheet-handle"></div>
    <div class="info-panel-header tabs-header spark-sheet-header">
      <h3>Панел с табове</h3>
      <div class="tab-nav">
        <button class="tab-btn active" data-tab="tab-stop">🛑 Спирка</button>
        <button class="tab-btn" data-tab="tab-extra">ℹ️ Инфо</button>
      </div>
    </div>

    <div class="info-panel-content spark-sheet-content" id="tab-content">
      <div id="tab-stop" class="tab-content active">
        <h4 id="stop-name">Име на спирка</h4>
        <div id="stop-info-content" class="stop-panel-content"></div>
      </div>

      <div id="tab-extra" class="tab-content">
        <h4 class="route-search-title">🔍 Търсене на маршрут</h4>
        <form id="route-search-form" class="route-search-form">
          <div class="form-group">
            <label for="start-stop" class="form-label">Начална спирка</label>
            <input type="text" id="start-stop" class="form-input" placeholder="напр. Орлов мост" value="Ж.К. ОВЧА КУПЕЛ-2" />
          </div>
          <div class="form-group">
            <label for="end-stop" class="form-label">Крайна спирка</label>
            <input type="text" id="end-stop" class="form-input" placeholder="напр. Централна гара" value="УЛ. ДАМЯНИЦА" />
          </div>
          <div class="form-row">
            <button type="button" id="reverse-direction-btn" class="action-btn secondary reverse-btn flex-1">🔁 Размени</button>
            <input type="hidden" id="direction-select" value="auto" />
          </div>
          <button type="submit" class="action-btn submit-btn">🔎 Търси маршрут</button>
        </form>
      </div>
    </div>
  </div>

  <!-- 📦 Скриптове -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <!-- Core -->
  <script src="./scripts/appState.js"></script>
  <script src="./utils.js"></script>

  <!-- Templates -->
  <script src="./templates/legend/legendTemplate.js"></script>
  <script src="./templates/schedule/scheduleTemplate.js"></script>
  <script src="./templates/popUp/popUpTemplate.js"></script>

  <!-- Data -->
  <script src="./scripts/data/loadRoutes.js"></script>
  <script src="./scripts/data/buildGraph.js"></script>

  <!-- Map Logic -->
  <script src="./scripts/map/initMap.js"></script>
  <script src="./scripts/map/hitTest.js"></script>
  <script src="./scripts/map/renderMapData.js"></script>
  <script src="./scripts/map/highlightRoute.js"></script>

  <!-- Routing -->
  <script src="./scripts/search/dijkstra.js"></script>
  <script src="./scripts/search/findMatchingRoutes.js"></script>

  <!-- UI -->
  <script src="./scripts/ui/bottomSheet.js"></script>
  <script src="./scripts/ui/infoPanelMode.js"></script>
  <script src="./scripts/ui/stopPanel.js"></script>
  <script src="./scripts/ui/scheduleHelpers.js"></script>

  <!-- Events -->
  <script src="./scripts/events/domListeners.js"></script>

  <!-- Entry Point -->
  <script src="./index2.js"></script>
  <script>
    // инициализация на bottom sheet след зареждане
    window.addEventListener('DOMContentLoaded', () => {
      window.bottomSheet?.initBottomSheet?.();
    });
  </script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      window.bottomSheet?.initBottomSheet?.(document.getElementById('info-panel'));
    });
  </script>
</body>
</html>
